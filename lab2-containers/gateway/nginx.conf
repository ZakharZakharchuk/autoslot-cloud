# AutoSlot API gateway.
#  - віддає веб-клієнт (index.html, admin.html);
#  - маршрутизує /api/* до сервісів і балансує запити між їхніми репліками;
#  - перед захищеними запитами питає auth-service, хто користувач (auth_request);
#  - обмежує частоту запитів і додає заголовки безпеки.
# Файл підключається всередину блоку http {}, тому директиви нижче — рівня http.

# Вбудований DNS Docker. valid=10s: адреси реплік перечитуються кожні 10 с,
# тож перезапущена репліка з новою IP знову отримує запити без перезапуску gateway.
resolver 127.0.0.11 valid=10s ipv6=off;

# Обмеження частоти запитів з однієї IP-адреси.
limit_req_zone $binary_remote_addr zone=login_code:10m rate=5r/m;     # запит коду: 5 на хвилину
limit_req_zone $binary_remote_addr zone=login_verify:10m rate=10r/m;  # введення коду: 10 на хвилину
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;    # решта API
limit_req_status 429;

# Пули реплік. resolve + zone: nginx бере з DNS адреси всіх реплік сервісу
# і розподіляє запити між ними по колу (round-robin).
upstream catalog_pool      { zone catalog 64k;      server catalog:8000 resolve; }
upstream availability_pool { zone availability 64k; server availability:8000 resolve; }
upstream booking_pool      { zone booking 64k;      server booking:8000 resolve; }
upstream notification_pool { zone notification 64k; server notification:8000 resolve; }
upstream auth_pool         { zone auth 64k;         server auth:8000 resolve; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;          # не показувати версію nginx
    client_max_body_size 16k;   # API приймає лише невеликі JSON

    include /etc/nginx/snippets/security_headers.conf;
    include /etc/nginx/snippets/proxy.conf;

    # Внутрішній підзапит перевірки сесії. Клієнт напряму викликати його не може.
    location = /_auth {
        internal;
        proxy_pass http://auth_pool/internal/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # Публічні запити (без входу)
    location /api/services      { limit_req zone=api burst=40 nodelay; proxy_pass http://catalog_pool; }
    location /api/masters       { limit_req zone=api burst=40 nodelay; proxy_pass http://catalog_pool; }
    location /api/availability  { limit_req zone=api burst=40 nodelay; proxy_pass http://availability_pool; }

    # Вхід: суворіше обмеження частоти проти перебору кодів і спаму листами
    # (додатково auth-service обмежує 3 коди на одну адресу за 15 хв і 5 спроб на один код)
    location = /api/auth/request-code { limit_req zone=login_code burst=5 nodelay; proxy_pass http://auth_pool; }
    location = /api/auth/verify       { limit_req zone=login_verify burst=10 nodelay; proxy_pass http://auth_pool; }
    location /api/auth/               { limit_req zone=api burst=40 nodelay; proxy_pass http://auth_pool; }

    # Захищені запити: спершу перевірка сесії, потім сервіс отримує X-User-* заголовки
    location /api/bookings      { include /etc/nginx/snippets/require_login.conf; proxy_pass http://booking_pool; }
    location /api/admin/        { include /etc/nginx/snippets/require_login.conf; proxy_pass http://booking_pool; }
    location /api/notifications { include /etc/nginx/snippets/require_login.conf; proxy_pass http://notification_pool; }

    location = /api/health {
        default_type application/json;
        return 200 '{"status":"ok","version":"2.1.0"}';
    }

    location /internal/ { return 404; }
    location /metrics   { return 404; }   # метрики лише для Prometheus у внутрішній мережі
    location /docs      { return 404; }

    location / {
        try_files $uri /index.html;
    }
}
