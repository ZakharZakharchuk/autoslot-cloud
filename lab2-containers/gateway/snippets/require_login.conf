# Підключається в захищені location.
# auth_request робить підзапит /_auth: 200 -> пропустити, 401 -> повернути клієнту 401.
auth_request /_auth;
# Заголовки з відповіді auth-service зберігаються в змінні й далі передаються сервісу (proxy.conf).
auth_request_set $auth_user_id    $upstream_http_x_user_id;
auth_request_set $auth_user_email $upstream_http_x_user_email;
auth_request_set $auth_user_role  $upstream_http_x_user_role;
limit_req zone=api burst=40 nodelay;
