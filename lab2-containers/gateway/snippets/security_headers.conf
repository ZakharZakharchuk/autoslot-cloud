# Заголовки безпеки для всіх відповідей.
# CSP: скрипти лише з файлів цього сайту (вбудовані <script> заборонені) — головний захист від XSS.
add_header X-Content-Type-Options "nosniff" always;   # браузер не вгадує тип файлу
add_header X-Frame-Options "DENY" always;             # сайт не можна вбудувати в чужий iframe
add_header Referrer-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Upstream $upstream_addr always;          # яка репліка обробила запит (для демонстрації балансування)
