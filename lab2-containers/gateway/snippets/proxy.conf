# Спільні налаштування проксування для всіх location.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Request-ID $request_id;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

# Особа користувача — лише з перевірки auth-service. Якщо клієнт сам надішле
# X-User-Role: ADMIN, nginx замінить його своїм значенням (у публічних location
# воно порожнє, і такий заголовок взагалі не передається).
proxy_set_header X-User-Id    $auth_user_id;
proxy_set_header X-User-Email $auth_user_email;
proxy_set_header X-User-Role  $auth_user_role;

proxy_connect_timeout 2s;
proxy_read_timeout 10s;
# Якщо репліка не відповідає — повторити на іншій. POST nginx не повторює
# (неідемпотентні запити), тож подвійного запису через повтор не буде.
proxy_next_upstream error timeout http_502 http_503;
