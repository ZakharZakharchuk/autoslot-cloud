<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AutoSlot — адміністрування</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="brand">Auto<span>Slot</span> <span class="muted" style="background:none;font-size:24px">адміністрування</span></h1>
    <div class="top-actions">
      <a href="/" class="tagline">До запису</a>
      <div class="account" id="account"></div>
    </div>
  </header>

  <div id="gate" class="notice" hidden></div>

  <main id="panel" hidden>
    <nav class="tabs" role="tablist" aria-label="Розділи">
      <a href="#bookings" role="tab" id="tab-btn-bookings" aria-controls="tab-bookings">Записи</a>
      <a href="#masters" role="tab" id="tab-btn-masters" aria-controls="tab-masters">Майстри</a>
      <a href="#activity" role="tab" id="tab-btn-activity" aria-controls="tab-activity">Активність</a>
    </nav>

    <!-- ---- Записи ---- -->
    <section id="tab-bookings" role="tabpanel" aria-labelledby="tab-btn-bookings" hidden>
      <form class="filters" id="filters">
        <div><label for="f-from">З дати</label><input id="f-from" type="date"></div>
        <div><label for="f-to">По дату</label><input id="f-to" type="date"></div>
        <div><label for="f-master">Майстер</label><select id="f-master"><option value="">усі</option></select></div>
        <div><label for="f-status">Статус</label>
          <select id="f-status"><option value="">усі</option><option value="CONFIRMED">підтверджені</option><option value="CANCELLED">скасовані</option></select></div>
        <div><label for="f-q">Пошук</label><input id="f-q" type="search" placeholder="ім'я, пошта, телефон"></div>
        <div><button class="btn" type="submit" style="font-size:18px;padding:10px">Показати</button></div>
      </form>

      <div class="stats" id="summary"></div>

      <h2>Записи <span class="muted" id="count" style="font-size:18px"></span></h2>
      <div class="table-wrap">
        <table class="data">
          <thead><tr><th>Дата й час</th><th>Послуги</th><th>Майстер</th><th>Клієнт</th><th>Пошта</th><th>Телефон</th><th>Сума</th><th>Статус</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>

    <!-- ---- Майстри ---- -->
    <section id="tab-masters" role="tabpanel" aria-labelledby="tab-btn-masters" hidden>
      <form class="filters" id="m-filters">
        <div><label for="m-from">З дати</label><input id="m-from" type="date"></div>
        <div><label for="m-to">По дату</label><input id="m-to" type="date"></div>
        <div><button class="btn" type="submit" style="font-size:18px;padding:10px">Показати</button></div>
      </form>
      <div class="cards" id="master-cards"></div>
    </section>

    <!-- ---- Активність ---- -->
    <section id="tab-activity" role="tabpanel" aria-labelledby="tab-btn-activity" hidden>
      <div class="filters" style="grid-template-columns: minmax(150px, 260px)">
        <div><label for="a-type">Показати</label>
          <select id="a-type">
            <option value="">усі події</option>
            <option value="CREATED">нові записи</option>
            <option value="CANCELLED">скасування клієнтами</option>
            <option value="CANCELLED_BY_ADMIN">дії адміністраторів</option>
          </select></div>
      </div>
      <ol class="feed" id="activity"></ol>
    </section>
  </main>
</div>

<script src="/auth.js"></script>
<script src="/admin.js"></script>
</body>
</html>
