# Render Blueprint (Infrastructure as Code) для лабораторної роботи 1.
# Специфікація: https://render.com/docs/blueprint-spec
# Файл має лежати в корені репозиторію; код сервісу — у lab1-cloud-deploy/.
services:
  - type: web
    name: autoslot-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: lab1-cloud-deploy
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_VERSION
        value: 1.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: autoslot-db
          property: connectionString

databases:
  - name: autoslot-db
    plan: free
    region: frankfurt
    databaseName: autoslot
    user: autoslot
